<div class="review-form-container">
  <h3>{{ mode === 'create' ? 'Write a Review' : 'Edit Review' }}</h3>
  
  <form [formGroup]="reviewForm" (ngSubmit)="onSubmit()">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Rating</mat-label>
      <mat-select formControlName="rating" required>
        <mat-option *ngFor="let rating of ratings" [value]="rating">
          {{ rating }} {{ rating === 1 ? 'Star' : 'Stars' }}
        </mat-option>
      </mat-select>
      <mat-error *ngIf="rating?.hasError('required')">
        Rating is required
      </mat-error>
      <mat-error *ngIf="rating?.hasError('min') || rating?.hasError('max')">
        Rating must be between 1 and 5
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Review</mat-label>
      <textarea 
        matInput 
        formControlName="text" 
        rows="6" 
        placeholder="Share your thoughts about this book..."
        required>
      </textarea>
      <mat-error *ngIf="text?.hasError('required')">
        Review text is required
      </mat-error>
    </mat-form-field>

    <div class="form-actions">
      <button 
        mat-raised-button 
        type="button" 
        (click)="onCancel()"
        [disabled]="isSubmitting">
        Cancel
      </button>
      <button 
        mat-raised-button 
        color="primary" 
        type="submit"
        [disabled]="isSubmitting || reviewForm.invalid">
        {{ isSubmitting ? 'Submitting...' : (mode === 'create' ? 'Submit Review' : 'Update Review') }}
      </button>
    </div>
  </form>
</div>
