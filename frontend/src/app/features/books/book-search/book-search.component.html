<div class="book-search-container">
  <h1>Search OpenLibrary</h1>
  
  <mat-form-field appearance="outline" class="search-field">
    <mat-label>Search for books</mat-label>
    <input 
      matInput 
      [formControl]="searchControl" 
      placeholder="Enter book title, author, or ISBN"
      type="text">
  </mat-form-field>

  <div *ngIf="errorMessage" class="error-message">
    {{ errorMessage }}
  </div>

  <div *ngIf="isLoading" class="loading-container">
    <mat-spinner></mat-spinner>
  </div>

  <div *ngIf="!isLoading && searchResults.length > 0" class="results-container">
    <h2>Search Results</h2>
    <div class="results-grid">
      <mat-card *ngFor="let book of searchResults" class="book-card">
        <img 
          mat-card-image 
          [src]="getCoverImageUrl(book.cover_i)" 
          [alt]="book.title"
          class="book-cover">
        <mat-card-content>
          <h3 class="book-title">{{ book.title }}</h3>
          <p class="book-author">{{ getAuthorName(book.author_name) }}</p>
          <p *ngIf="book.first_publish_year" class="book-year">
            Published: {{ book.first_publish_year }}
          </p>
        </mat-card-content>
        <mat-card-actions>
          <button 
            mat-raised-button 
            color="primary" 
            (click)="addToLibrary(book)"
            [disabled]="isAddingBook(book)">
            {{ isAddingBook(book) ? 'Adding...' : 'Add to Library' }}
          </button>
        </mat-card-actions>
      </mat-card>
    </div>
  </div>

  <div *ngIf="!isLoading && searchControl.value && searchResults.length === 0 && !errorMessage" class="no-results">
    <p>No books found. Try a different search term.</p>
  </div>
</div>
