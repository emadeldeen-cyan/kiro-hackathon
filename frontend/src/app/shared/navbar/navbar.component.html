<mat-toolbar color="primary" class="navbar" role="navigation" aria-label="Main navigation">
  <div class="navbar-container">
    <!-- Logo/Brand -->
    <a routerLink="/" class="navbar-brand" aria-label="Book Management home page">
      <mat-icon aria-hidden="true">book</mat-icon>
      <span class="brand-text">Book Management</span>
    </a>

    <!-- Navigation Links for Authenticated Users -->
    <nav class="navbar-links" *ngIf="isAuthenticated" aria-label="Primary navigation">
      <a
        mat-button
        routerLink="/books/search"
        routerLinkActive="active-link"
        class="nav-link"
        aria-label="Search for books"
      >
        <mat-icon aria-hidden="true">search</mat-icon>
        <span>Search Books</span>
      </a>
      <a
        mat-button
        routerLink="/books/library"
        routerLinkActive="active-link"
        class="nav-link"
        aria-label="View my library"
      >
        <mat-icon aria-hidden="true">library_books</mat-icon>
        <span>My Library</span>
      </a>
      <a
        mat-button
        routerLink="/reviews/my-reviews"
        routerLinkActive="active-link"
        class="nav-link"
        aria-label="View my reviews"
      >
        <mat-icon aria-hidden="true">rate_review</mat-icon>
        <span>My Reviews</span>
      </a>
    </nav>

    <!-- Spacer -->
    <span class="navbar-spacer"></span>

    <!-- User Menu for Authenticated Users -->
    <div class="navbar-user" *ngIf="isAuthenticated">
      <button 
        mat-icon-button 
        [matMenuTriggerFor]="userMenu" 
        class="user-menu-button"
        aria-label="Open user menu"
        aria-haspopup="true">
        <mat-icon aria-hidden="true">account_circle</mat-icon>
      </button>
      <mat-menu #userMenu="matMenu" aria-label="User menu">
        <button mat-menu-item [routerLink]="['/profile', (currentUser$ | async)?.id]" aria-label="View profile">
          <mat-icon aria-hidden="true">person</mat-icon>
          <span>Profile</span>
        </button>
        <button mat-menu-item (click)="logout()" aria-label="Logout">
          <mat-icon aria-hidden="true">logout</mat-icon>
          <span>Logout</span>
        </button>
      </mat-menu>
    </div>

    <!-- Auth Links for Unauthenticated Users -->
    <div class="navbar-auth" *ngIf="!isAuthenticated" role="navigation" aria-label="Authentication">
      <a mat-button routerLink="/login" routerLinkActive="active-link" class="auth-link" aria-label="Login to your account">
        Login
      </a>
      <a mat-raised-button color="accent" routerLink="/register" class="auth-link" aria-label="Create a new account">
        Register
      </a>
    </div>
  </div>
</mat-toolbar>
